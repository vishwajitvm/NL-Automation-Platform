[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "host-agent"
version = "0.1.0"
description = "Cross-platform host agent for NL-Automation Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
]

[project.scripts]
host-agent = "host_agent.__main__:main"
